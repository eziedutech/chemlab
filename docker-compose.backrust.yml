# Backend only, for a deployment that runs each service as its own unit.
# The frontend reaches this over the public API hostname from the browser, so
# the two never need to share a compose project.
services:
  backrust:
    build:
      context: ./backrust
    environment:
      PORT: 8080
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      # A second spelling of the first provider, accepted because writing the
      # sets as 1, 2, 3 is the natural thing to do.
      LLM_BASE_URL_1: ${LLM_BASE_URL_1:-}
      LLM_MODEL_1: ${LLM_MODEL_1:-}
      LLM_API_KEY_1: ${LLM_API_KEY_1:-}
      # Optional backups, tried in order when the one above fails.
      LLM_BASE_URL_2: ${LLM_BASE_URL_2:-}
      LLM_MODEL_2: ${LLM_MODEL_2:-}
      LLM_API_KEY_2: ${LLM_API_KEY_2:-}
      LLM_BASE_URL_3: ${LLM_BASE_URL_3:-}
      LLM_MODEL_3: ${LLM_MODEL_3:-}
      LLM_API_KEY_3: ${LLM_API_KEY_3:-}
      # Explicit origin rather than a wildcard.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "8080"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
